name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        working-directory: . # اگر آپ کا پروجیکٹ کسی فولڈر کے اندر ہے تو یہاں اس فولڈر کا نام لکھیں (مثلاً my-app)

      - name: Build APK
        run: flutter build apk --release
        working-directory: . # یہاں بھی وہی فولڈر کا نام لکھیں

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
          
